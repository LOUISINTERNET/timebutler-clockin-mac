name: Pages

# Deploys docs/ as the GitHub Pages site. Runs only when docs/ changes; requires the
# repository's Pages source to be set to "GitHub Actions" once:
#   gh api -X PUT repos/LOUISINTERNET/timebutler-clockin-mac/pages -f build_type=workflow

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
