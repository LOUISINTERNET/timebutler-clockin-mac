name: ClockIn
options:
  bundleIdPrefix: app.clockin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    DEVELOPMENT_TEAM: A5278RL7RX
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
    Release:
      CODE_SIGN_STYLE: Manual
      # Release builds only run in .github/workflows/release.yml, whose temporary keychain
      # holds exactly one Developer ID certificate (G2), so the generic name is unambiguous.
      CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  ClockIn:
    type: application
    platform: macOS
    sources:
      - path: ClockIn
    settings:
      base:
        PRODUCT_NAME: ClockIn
        PRODUCT_BUNDLE_IDENTIFIER: app.clockin
        INFOPLIST_FILE: ClockIn/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ClockIn/Resources/ClockIn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle

  ClockInTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: ClockIn
        excludes:
          - "App/**"
          - "Resources/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.clockin.Tests
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen would otherwise pick up the app's Info.plist from the shared source tree.
        INFOPLIST_FILE: ""

schemes:
  ClockIn:
    build:
      targets:
        ClockIn: all
        ClockInTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClockInTests
